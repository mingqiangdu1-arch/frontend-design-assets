name: Editorial React · Build and Browser QA
on:
  push:
    paths:
      - "playground/editorial-review/**"
      - "packages/ui/**"
      - "tests/browser/editorial-review.spec.mjs"
      - "playwright.editorial.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/editorial-react.yml"
  pull_request:
    paths:
      - "playground/editorial-review/**"
      - "packages/ui/**"
      - "tests/browser/editorial-review.spec.mjs"
      - "playwright.editorial.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/editorial-react.yml"
jobs:
  typecheck-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Typecheck true React package integration
        run: npm run typecheck:ui
      - name: Build Editorial Review
        run: npm run build:editorial-react
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser flows and responsive captures
        run: npm run test:editorial-react:browser
      - name: Generate unapproved screenshot evidence
        if: always()
        run: node scripts/visual-evidence.mjs capture --dir=test-results --out=test-results/visual-evidence.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-react-review-capture
          path: |
            test-results/
            dist/editorial-review/
          if-no-files-found: ignore
          retention-days: 14
