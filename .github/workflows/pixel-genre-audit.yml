name: Pixel Arcade genre-aware source audit (advisory)
on:
  push:
    branches:
      - codex/pixel-arcade-genre-review-pilot
    paths:
      - "playground/creative-style-lab/**"
      - "scripts/triage-genre-audit.mjs"
      - "tests/triage-genre-audit.test.mjs"
      - "registry/genre-review-decisions.json"
      - ".github/workflows/pixel-genre-audit.yml"
  pull_request:
    paths:
      - "playground/creative-style-lab/**"
      - "scripts/triage-genre-audit.mjs"
      - "tests/triage-genre-audit.test.mjs"
      - "registry/genre-review-decisions.json"
      - ".github/workflows/pixel-genre-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Candidate source
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Baseline source
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
          persist-credentials: false
      - name: Pinned official Hallmark lint executable
        uses: actions/checkout@v4
        with:
          repository: Nutlope/hallmark
          ref: 52328cb3129135499e4e178d4864ee90029dea2b
          path: upstream
          sparse-checkout: |
            skills/hallmark/scripts/sloplint.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute same upstream source-only audit on both versions
        shell: bash
        run: |
          mkdir -p audit
          set +e
          (cd baseline && node ../upstream/skills/hallmark/scripts/sloplint.mjs playground/creative-style-lab/index.html playground/creative-style-lab/lab.css --genre playful --json) > audit/baseline.json 2> audit/baseline.stderr
          baseline_exit=$?
          (cd candidate && node ../upstream/skills/hallmark/scripts/sloplint.mjs playground/creative-style-lab/index.html playground/creative-style-lab/lab.css --genre playful --json) > audit/candidate.json 2> audit/candidate.stderr
          candidate_exit=$?
          set -e
          echo "Hallmark advisory exits: baseline=$baseline_exit candidate=$candidate_exit"
          node candidate/scripts/triage-genre-audit.mjs audit/baseline.json audit/candidate.json pixel-arcade candidate/registry/genre-review-decisions.json > audit/contextual-review.md
          cat audit/contextual-review.md
          cat audit/contextual-review.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Store raw scan and unfiltered contextual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-arcade-source-audit
          path: audit/
          if-no-files-found: error
