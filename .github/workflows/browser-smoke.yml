name: Browser smoke — Style Explorer
on:
  push:
    paths:
      - "playground/**"
      - "registry/creative-directions.json"
      - "registry/assets.json"
      - "registry/styles.json"
      - "registry/style-facets.json"
      - "registry/style-assembly.json"
      - "scripts/style-assembly.mjs"
      - "scripts/build-style-brief.mjs"
      - "scripts/style-match.mjs"
      - "scripts/select-style.mjs"
      - "scripts/check-style-facets.mjs"
      - "scripts/dev-static.mjs"
      - "styles/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-smoke.yml"
  pull_request:
    paths:
      - "playground/**"
      - "registry/creative-directions.json"
      - "registry/assets.json"
      - "registry/styles.json"
      - "registry/style-facets.json"
      - "registry/style-assembly.json"
      - "scripts/style-assembly.mjs"
      - "scripts/build-style-brief.mjs"
      - "scripts/style-match.mjs"
      - "scripts/select-style.mjs"
      - "scripts/check-style-facets.mjs"
      - "scripts/dev-static.mjs"
      - "styles/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-smoke.yml"
permissions:
  contents: read
jobs:
  playwright-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test runner
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke checks
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-explorer-browser-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
