name: Browser smoke — Style Explorer
on:
  push:
    paths:
      - "playground/style-explorer/**"
      - "playground/bold-grid/**"
      - "playground/interaction-lab/**"
      - "playground/page-blueprints/**"
      - "styles/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/browser-smoke.yml"
  pull_request:
    paths:
      - "playground/style-explorer/**"
      - "playground/bold-grid/**"
      - "playground/interaction-lab/**"
      - "playground/page-blueprints/**"
      - "styles/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/browser-smoke.yml"

jobs:
  playwright-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke checks
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-explorer-browser-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
