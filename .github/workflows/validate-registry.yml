name: Validate asset index
on:
  push:
    paths:
      - "registry/**"
      - "scripts/check-registry.mjs"
      - "docs/**"
      - "tokens/**"
      - "recipes/**"
      - "playground/**"
      - ".github/workflows/validate-registry.yml"
  pull_request:
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-registry.mjs
