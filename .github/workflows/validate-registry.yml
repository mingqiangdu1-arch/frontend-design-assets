name: Validate asset registry and SaaS examples
on:
  push:
    paths:
      - "registry/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "styles/**"
      - "tokens/**"
      - "recipes/**"
      - "playground/**"
      - "components/**"
      - "applications/**"
      - "package.json"
      - "LICENSE"
      - "NOTICE.md"
      - ".github/workflows/validate-registry.yml"
  pull_request:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of all scripts and standalone playground modules
        run: |
          node -e '
          import { readdirSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { join } from "node:path";
          function walk(dir, out = []) {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === "node_modules" || entry.name === "dist") continue;
              const full = join(dir, entry.name);
              if (entry.isDirectory()) walk(full, out);
              else if (entry.name.endsWith(".mjs")) out.push(full);
            }
            return out;
          }
          const files = [...walk("scripts"), ...walk("playground")].sort();
          for (const file of files) execFileSync(process.execPath, ["--check", file], { stdio: "inherit" });
          console.log(`Syntax checked ${files.length} .mjs files across scripts/ and playground/.`);
          '
      - name: Check reproducible public graphics
        run: |
          node scripts/generate-public-overview.mjs
          node scripts/generate-public-visuals.mjs
          git diff --exit-code -- docs/media/inventory.svg docs/media/cover.svg docs/media/style-atlas.svg
      - name: Validate registry and referenced files
        run: node scripts/check-registry.mjs
      - name: Validate complete page template registry
        run: node scripts/check-page-templates.mjs
      - name: Validate experimental creative grammars
        run: node scripts/check-creative-directions.mjs
      - name: Audit scoped theme contrast and CSS token drift
        run: node scripts/contrast-audit.mjs
      - name: Validate selected React state matrix declarations
        run: node scripts/check-component-states.mjs
      - name: Test isolated state models
        run: node --test tests/*.test.mjs
      - name: Release hygiene, privacy and license preflight
        run: node scripts/check-public-snapshot.mjs --release
