name: Validate asset registry and SaaS examples
on:
  push:
    paths:
      - "registry/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "styles/**"
      - "tokens/**"
      - "recipes/**"
      - "playground/**"
      - "components/**"
      - "applications/**"
      - ".github/workflows/validate-registry.yml"
  pull_request:
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate registry and referenced files
        run: node scripts/check-registry.mjs
      - name: Validate complete page template registry
        run: node scripts/check-page-templates.mjs
      - name: Validate standalone demo syntax
        run: |
          node --check playground/saas-patterns/model.mjs
          node --check playground/saas-patterns/app.mjs
          node --check playground/saas-editing/model.mjs
          node --check playground/saas-editing/app.mjs
          node --check playground/style-explorer/model.mjs
          node --check playground/style-explorer/explorer.mjs
          node --check playground/bold-grid/model.mjs
          node --check playground/bold-grid/app.mjs
          node --check playground/interaction-lab/model.mjs
          node --check playground/interaction-lab/app.mjs
          node --check playground/page-blueprints/gallery.mjs
          node --check playground/page-blueprints/editorial-library/model.mjs
          node --check playground/page-blueprints/editorial-library/app.mjs
          node --check playground/page-blueprints/mobile-habits/model.mjs
          node --check playground/page-blueprints/mobile-habits/app.mjs
          node --check scripts/compose-page.mjs
          node --check scripts/check-page-templates.mjs
          node --check playground/asset-explorer/model.mjs
          node --check playground/asset-explorer/app.mjs
          node --check playground/commerce-atelier/model.mjs
          node --check playground/commerce-atelier/app.mjs
          node --check scripts/visual-evidence.mjs
          node --check scripts/check-component-states.mjs
          node --check scripts/dev-static.mjs
      - name: Audit scoped theme contrast and CSS token drift
        run: node scripts/contrast-audit.mjs
      - name: Validate asset finder syntax
        run: node --check scripts/find-assets.mjs
      - name: Validate selected React state matrix declarations
        run: node scripts/check-component-states.mjs
      - name: Test isolated state models
        run: node --test tests/*.test.mjs
