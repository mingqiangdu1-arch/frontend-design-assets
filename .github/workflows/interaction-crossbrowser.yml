name: Advanced Interaction Lab II — multi-engine and accessibility smoke
on:
  push:
    paths:
      - "playground/advanced-interactions-v2/**"
      - "tests/browser/advanced-interactions-v2.crossbrowser.spec.mjs"
      - "playwright.interaction-crossbrowser.config.mjs"
      - ".github/workflows/interaction-crossbrowser.yml"
  pull_request:
    paths:
      - "playground/advanced-interactions-v2/**"
      - "tests/browser/advanced-interactions-v2.crossbrowser.spec.mjs"
      - "playwright.interaction-crossbrowser.config.mjs"
      - ".github/workflows/interaction-crossbrowser.yml"
permissions:
  contents: read
jobs:
  multi-browser-interaction-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium, Firefox and WebKit with system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser keyboard, focus, drag and touch-emulation smoke
        run: npx playwright test -c playwright.interaction-crossbrowser.config.mjs
      - name: Save browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-interactions-v2-crossbrowser
          path: |
            playwright-report-interaction-xbrowser/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
