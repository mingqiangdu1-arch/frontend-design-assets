<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Pendulum label / 摆锤标签</title><desc id="desc">Original standalone vector scene, hover-activated self-contained CSS motion and prefers-reduced-motion static fallback. Decorative only.</desc><style>@keyframes p51{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}svg:hover .pendulum{animation:p51 2.2s ease-in-out infinite}.pendulum{transform-origin:320px 40px}@media(prefers-reduced-motion:reduce){svg:hover .pendulum{animation:none}}</style><rect width="640" height="360" fill="#2e4655"/><path d="M120 40H520" stroke="#e6cead" stroke-width="8" stroke-linecap="round"/><circle cx="320" cy="40" r="16" fill="#e7af83"/><g class="pendulum"><path d="M320 40V233" stroke="#f2dec1" stroke-width="9"/><circle cx="320" cy="252" r="54" fill="#89bfae" stroke="#e7d9bc" stroke-width="6"/><path d="M299 251h42M320 230v42" stroke="#37546a" stroke-width="7"/></g><path d="M211 307Q320 345 429 307" fill="none" stroke="#8daca7" stroke-width="3" stroke-dasharray="7 10"/></svg>