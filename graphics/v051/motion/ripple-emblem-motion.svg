<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Ripple emblem / 水纹徽记</title><desc id="desc">Original standalone vector scene, hover-activated self-contained CSS motion and prefers-reduced-motion static fallback. Decorative only.</desc><style>@keyframes w51{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.13);opacity:.22}}svg:hover .ring{animation:w51 2.6s ease-out infinite alternate}.ring{transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){svg:hover .ring{animation:none}}</style><rect width="640" height="360" fill="#dbe9dc"/><g class="ring" fill="none" stroke="#5a9a90" stroke-width="5"><circle cx="320" cy="180" r="65"/><circle cx="320" cy="180" r="102"/><circle cx="320" cy="180" r="140"/></g><circle cx="320" cy="180" r="53" fill="#265e6e"/><path d="m320 137 14 28 31 4-23 21 6 31-28-14-28 14 6-31-23-21 31-4Z" fill="#f1c48a" stroke="#e9e3bf" stroke-width="3"/></svg>