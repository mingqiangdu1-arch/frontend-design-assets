<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">Radar Scope — original green instrument illustration</title>
<desc id="d">A static green circular radar interface with grid rings, sweep sector and three glowing signal markers on a dark instrument panel.</desc>
<defs>
<radialGradient id="bg"><stop stop-color="#1c4940"/><stop offset="1" stop-color="#0c2428"/></radialGradient>
<linearGradient id="sweep"><stop stop-color="#93f2be" stop-opacity=".55"/><stop offset="1" stop-color="#93f2be" stop-opacity=".01"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="640" height="360" fill="#0b1a24"/>
<rect x="92" y="20" width="456" height="320" rx="22" fill="url(#bg)" stroke="#2c8b7e" stroke-width="2"/>
<g transform="translate(320 180)" fill="none">
<circle r="140" stroke="#61cda3" opacity=".85" stroke-width="2"/>
<circle r="108" stroke="#72d5ab" opacity=".4"/><circle r="76" stroke="#72d5ab" opacity=".4"/><circle r="43" stroke="#72d5ab" opacity=".4"/>
<path d="M-140 0H140 M0 -140V140 M-100 -100 100 100 M100 -100 -100 100" stroke="#5fc79a" opacity=".23"/>
<path d="M0 0 L-25 -138 A140 140 0 0 1 125 63 Z" fill="url(#sweep)" stroke="#9cecc1" stroke-opacity=".22"/>
<circle cx="-68" cy="-43" r="5" fill="#e2e98b"/><circle cx="86" cy="42" r="6" fill="#b8f0cb"/><circle cx="43" cy="-102" r="4" fill="#e6ba80"/>
<circle cx="-68" cy="-43" r="10" fill="#e2e98b" opacity=".3" filter="url(#glow)"/>
<circle cx="86" cy="42" r="11" fill="#b8f0cb" opacity=".3" filter="url(#glow)"/>
</g>
<g fill="#81d8b7" opacity=".75"><circle cx="120" cy="48" r="3"/><circle cx="520" cy="48" r="3"/><circle cx="120" cy="310" r="3"/><circle cx="520" cy="310" r="3"/></g>
</svg>