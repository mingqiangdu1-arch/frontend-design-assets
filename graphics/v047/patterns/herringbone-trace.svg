<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc"><title id="title">Herringbone Trace / 人字斜纹</title><desc id="desc">Original repeating vector surface tile. Its embedded SVG pattern repeats at 32 user units; no external texture or licensed media.</desc><defs><pattern id="repeat" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 0 16 16 0 32M16 0 32 16 16 32" fill="none" stroke="#617d77" stroke-width="2.5" opacity=".75"/><path d="M0 16 16 32 32 16" fill="none" stroke="#c69b78" stroke-width="1" opacity=".8"/></pattern></defs><rect width="256" height="256" fill="#e7e2d7"/><rect width="256" height="256" fill="url(#repeat)"/></svg>