<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc"><title id="title">Microdot Field / 细点织理</title><desc id="desc">Original repeating vector surface tile. Its embedded SVG pattern repeats at 32 user units; no external texture or licensed media.</desc><defs><pattern id="repeat" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.3" fill="#7b8f8a"/><circle cx="18" cy="18" r="1.1" fill="#b2a999"/></pattern></defs><rect width="256" height="256" fill="#f3f1e8"/><rect width="256" height="256" fill="url(#repeat)"/></svg>