<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc"><title id="title">Modular Trace / 模块导线纹</title><desc id="desc">Original repeating vector surface tile. Its embedded SVG pattern repeats at 64 user units; no external texture or licensed media.</desc><defs><pattern id="repeat" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M0 20h30l10-10h20M20 0v30l10 10v20M60 40H40L20 60" fill="none" stroke="#70b7a4" stroke-width="3"/><circle cx="40" cy="10" r="5" fill="#e8c077"/><rect x="47" y="48" width="12" height="12" rx="2" fill="#416e75"/></pattern></defs><rect width="256" height="256" fill="#122f3d"/><rect width="256" height="256" fill="url(#repeat)"/></svg>