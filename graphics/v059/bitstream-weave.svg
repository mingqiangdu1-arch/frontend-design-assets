<path d="M-60 237C122 35 261 65 364 195S571 326 713 91" fill="none" stroke="url(#teal)" stroke-width="96" stroke-linecap="round"/>
<path d="M-44 70C99 244 201 340 342 169S557 24 689 271" fill="none" stroke="#574258" stroke-width="87" stroke-linecap="round"/>
<path d="M-44 70C99 244 201 340 342 169S557 24 689 271" fill="none" stroke="url(#gold)" stroke-width="79" stroke-linecap="round"/>
<path d="M174 204C230 162 285 122 340 177" fill="none" stroke="#1e3e4b" stroke-width="62" stroke-linecap="round"/>
<path d="M174 204C230 162 285 122 340 177" fill="none" stroke="url(#teal)" stroke-width="54" stroke-linecap="round"/>
<g stroke="#becfc8" stroke-opacity=".3" fill="none"><circle cx="320" cy="180" r="143"/><circle cx="320" cy="180" r="98"/></g>
</g></svg>