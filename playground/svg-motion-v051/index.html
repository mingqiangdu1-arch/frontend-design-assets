<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V0.51 SVG self-contained motion specimens</title><style>*{box-sizing:border-box}body{margin:0;background:#e9f0eb;color:#25454b;font:15px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:2rem 1rem 4rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}figure{background:white;margin:0;border:1px solid #d2dfd8;border-radius:.9rem;padding:1rem}img{display:block;width:100%;height:auto;border-radius:.45rem}figcaption{font-weight:800;margin-top:.6rem}small{color:#6b827f}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Self-contained hover animated SVG</h1><p>每个 SVG 源文件都内嵌 CSS 动效，只在鼠标悬停时执行。系统设置“减少动态效果”时保持静态；作为 img 引入时不提供键盘触发，故只适合作为装饰素材。</p><div class="grid"><figure><img src="../../graphics/v051/motion/orbit-wreath-motion.svg" alt="Orbit wreath motion / 轨迹花环"><figcaption>VG-077 · Orbit wreath motion / 轨迹花环</figcaption><small>abstract symmetrical wreath, outer ring turns on hover</small></figure><figure><img src="../../graphics/v051/motion/breathing-rosace-motion.svg" alt="Breathing rosace / 呼吸花窗"><figcaption>VG-078 · Breathing rosace / 呼吸花窗</figcaption><small>radial translucent leaf window that gently pulses on hover</small></figure><figure><img src="../../graphics/v051/motion/pendulum-label-motion.svg" alt="Pendulum label / 摆锤标签"><figcaption>VG-079 · Pendulum label / 摆锤标签</figcaption><small>graphic pendulum tether with controlled CSS oscillation on hover</small></figure><figure><img src="../../graphics/v051/motion/ripple-emblem-motion.svg" alt="Ripple emblem / 水纹徽记"><figcaption>VG-080 · Ripple emblem / 水纹徽记</figcaption><small>concentric independent ripple ring opacity on hover</small></figure></div></main></body></html>
